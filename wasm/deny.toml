# cargo-deny configuration for the WebAssembly package, rust/deny.toml's policy. Run from wasm/: cargo deny check
# Permissive licences only, crates.io only.

[advisories]
version = 2
yanked = "deny"

[bans]
multiple-versions = "warn"
wildcards = "deny"
# The path dependency on ../rust (this crate is never published to crates.io: publish = false).
allow-wildcard-paths = true

[licenses]
version = 2
allow = [
    "Apache-2.0",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
