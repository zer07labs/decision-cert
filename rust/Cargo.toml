[package]
name = "decision-cert"
version = "0.1.0"
edition = "2021"
description = "Load, verify and apply decision-certificate.v1 (spec/decision-certificate.v1.md)"
license = "Apache-2.0"

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
ed25519-dalek = "2"
serde = { version = "1", features = ["derive"] }
serde_jcs = "0.2"
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
thiserror = "2"

[dev-dependencies]
ed25519-dalek = { version = "2", features = ["rand_core"] }
