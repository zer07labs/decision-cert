[package]
name = "decision-cert"
version = "0.1.0"
edition = "2021"
description = "Verify and apply decision-certificate.v1: signed records of how a model's decisions were measured"
license = "Apache-2.0"
repository = "https://github.com/zer07labs/decision-cert"
readme = "../README.md"
homepage = "https://github.com/zer07labs/decision-cert"
documentation = "https://docs.rs/decision-cert"
keywords = ["certificate", "calibration", "ed25519", "jcs", "verification"]
categories = ["cryptography", "science"]
# The conformance tests and the verdict example read ../fixtures, which is outside the package;
# they run in this repo's CI.
exclude = ["tests/**", "examples/**", "deny.toml"]
publish = false  # not on crates.io yet; consumers pin a git rev

[package.metadata.docs.rs]
all-features = true

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
ed25519-dalek = "2"
serde = { version = "1", features = ["derive"] }
serde_jcs = "0.2"
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
thiserror = "2"

[dev-dependencies]
ed25519-dalek = { version = "2", features = ["rand_core"] }
