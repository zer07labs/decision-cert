# cargo-deny configuration. Run from rust/: cargo deny check
# Permissive licences only, crates.io only.

[advisories]
version = 2
yanked = "deny"
ignore = [
    # chrono is unmaintained (advisory published 2026-11-17, all versions, no safe upgrade). No known vulnerability;
    # replacing it is tracked in issue #66. Re-check by 2027-02-28.
    { id = "RUSTSEC-2026-0543", reason = "chrono unmaintained; replacement tracked in #66" },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[licenses]
version = 2
allow = [
    "Apache-2.0",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
