name: ci

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  wording:
    # A certificate describes a measured process and never promises an outcome. Fail on any promise
    # word in the public docs, except the sentences that say a certificate never guarantees one.
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: no outcome promises in spec, docs or top-level docs
        run: |
          hits="$(grep -rniE 'warrant|guarantee|assur|underwrit' spec docs plans demo README.md CONTRIBUTING.md SECURITY.md CHANGELOG.md \
            | grep -viE 'never guarantees? (an|one) outcome' || true)"
          if [ -n "$hits" ]; then echo "$hits"; exit 1; fi

  rust:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - run: cargo test --locked --all-features
      # The conformance suite reads ../fixtures; run it by name so a skipped or empty run fails loudly.
      - name: conformance fixtures (fixtures/)
        run: |
          test "$(find ../fixtures -maxdepth 1 -name '*.json' | wc -l)" -ge 14
          cargo test --locked --test conformance -- --exact rust_and_python_agree_on_every_fixture every_schema_invalid_mutation_is_rejected
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: rust/Cargo.toml
          command: check
          arguments: --all-features

  publish-readiness:
    # Release readiness without publishing: the crate packages and dry-runs, the docs build as
    # docs.rs builds them, the Python sdist and wheel build and pass metadata checks, and both
    # packages carry the repository LICENSE.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: docs build as docs.rs does (warnings are errors)
        working-directory: rust
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --all-features --locked
      - name: the packaged LICENSE files and the issuer's schema match the repository's
        run: |
          cmp LICENSE rust/LICENSE && cmp LICENSE python/LICENSE
          cmp spec/decision-certificate.v1.schema.json python/src/decision_cert/issue/decision-certificate.v1.schema.json
      - name: cargo package --list and cargo publish --dry-run
        working-directory: rust
        run: |
          if grep -q '^publish' Cargo.toml; then echo "Cargo.toml must not set publish"; exit 1; fi
          cargo package --list --locked | tee "$RUNNER_TEMP/files.txt"
          for f in README.md LICENSE src/lib.rs src/bin/decision-cert.rs; do grep -qx "$f" "$RUNNER_TEMP/files.txt"; done
          if grep -E '^(tests/|fixtures/|examples/)' "$RUNNER_TEMP/files.txt"; then echo "package carries tests or fixtures"; exit 1; fi
          cargo publish --dry-run --locked
      - uses: astral-sh/setup-uv@v6
      - name: Python sdist and wheel build and pass metadata checks
        working-directory: python
        run: |
          uv build --out-dir "$RUNNER_TEMP/dist"
          uvx twine check --strict "$RUNNER_TEMP"/dist/*
          unzip -l "$RUNNER_TEMP"/dist/*.whl | grep -q 'decision_cert/py.typed'
          unzip -l "$RUNNER_TEMP"/dist/*.whl | grep -q 'licenses/LICENSE'
          unzip -l "$RUNNER_TEMP"/dist/*.whl | grep -q 'decision_cert/issue/decision-certificate.v1.schema.json'
      - name: the base install verifies without the issuer's dependencies
        run: |
          uv venv -q "$RUNNER_TEMP/base" --python 3.12
          uv pip install -q --python "$RUNNER_TEMP/base" "$RUNNER_TEMP"/dist/*.whl
          "$RUNNER_TEMP/base/bin/python" -c "import importlib.util as u, decision_cert; assert u.find_spec('numpy') is None"
          "$RUNNER_TEMP/base/bin/python" -m decision_cert verify demo/example/certificate.json --keys demo/example/trusted-keys.json --now 2026-11-07T00:00:00Z

  fixtures:
    # The manifest covers exactly the fixture files, and every hash matches.
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 5
    defaults:
      run:
        working-directory: fixtures
    steps:
      - uses: actions/checkout@v4
      - run: sha256sum --strict -c FIXTURES.sha256
      - name: the manifest lists every fixture file and nothing else
        run: diff <(find . -name '*.json' | sed 's|^\./||' | LC_ALL=C sort) <(awk '{print $2}' FIXTURES.sha256 | LC_ALL=C sort)

  python:
    # The Python verifier: lint, types, the shared fixture loop, the differential test against the
    # Rust crate (needs cargo), and the generator check that the negative fixtures are current.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked --python 3.12
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy
      - run: uv run pytest -v
      - name: the reference issuer regenerates its fixtures byte-identical
        run: uv run python tools/gen_positive_fixtures.py --check
      - name: negative fixtures and manifest are current
        run: uv run python tools/gen_negative_fixtures.py --check
      - name: demo files and manifest are current
        run: uv run python tools/gen_demos.py --check

  demos:
    # Every demo file is hash-listed, and both verifiers accept every demo certificate.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: the manifest lists every demo file, and every hash matches
        working-directory: demo
        run: |
          sha256sum --strict -c DEMOS.sha256
          diff <(find . -name '*.json' | sed 's|^\./||' | LC_ALL=C sort) <(awk '{print $2}' DEMOS.sha256 | LC_ALL=C sort)
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - uses: astral-sh/setup-uv@v6
      - name: the Rust and Python CLIs verify every demo certificate
        run: |
          (cd rust && cargo build -q --locked --features cli)
          (cd python && uv sync -q --locked --python 3.12)
          n=0
          while IFS= read -r c; do
            k="$(dirname "$c")/trusted-keys.json"
            r="$(rust/target/debug/decision-cert verify "$c" --keys "$k")"
            p="$(cd python && uv run -q python -m decision_cert verify "../$c" --keys "../$k")"
            test "$r" = "$p"; echo "$c $r"; n=$((n + 1))
          done < <(find demo -name certificate.json | LC_ALL=C sort)
          test "$n" -ge 1

  quickstart:
    # Runs the README's quickstart line with the published package. On a pull request the URLs point
    # at the PR's head commit instead of main, since the files may not be on main yet.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: the documented line exits 0
        env:
          REF: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          line="$(sed -n '/<!-- quickstart -->/,/^```$/p' README.md | sed -n '3p')"
          case "$line" in "uvx decision-cert verify "*) ;; *) echo "quickstart line not found: $line"; exit 1 ;; esac
          bash -c "${line//\/main\//\/$REF\/}"
