name: ci

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  wording:
    # A certificate describes a measured process and never promises an outcome. Fail on any promise
    # word in the public docs, except the sentences that say a certificate never guarantees one.
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: no outcome promises in spec, docs or top-level docs
        run: |
          hits="$(grep -rniE 'warrant|guarantee|assur|underwrit' spec docs plans README.md CONTRIBUTING.md SECURITY.md CHANGELOG.md \
            | grep -viE 'never guarantees? (an|one) outcome' || true)"
          if [ -n "$hits" ]; then echo "$hits"; exit 1; fi

  rust:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - run: cargo test --locked --all-features
      # The conformance suite reads ../fixtures; run it by name so a skipped or empty run fails loudly.
      - name: conformance fixtures (fixtures/)
        run: |
          test "$(find ../fixtures -maxdepth 1 -name '*.json' | wc -l)" -ge 14
          cargo test --locked --test conformance -- --exact rust_and_python_agree_on_every_fixture every_schema_invalid_mutation_is_rejected
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: rust/Cargo.toml
          command: check
          arguments: --all-features

  publish-readiness:
    # crates.io readiness without publishing: `cargo publish --dry-run` refuses while
    # `publish = false`, so run it on a throwaway copy with that line removed. main keeps it.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: docs build as docs.rs does (warnings are errors)
        working-directory: rust
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --all-features --locked
      - name: cargo package --list and cargo publish --dry-run on a copy
        run: |
          tmp="$(mktemp -d)"
          cp -R rust README.md "$tmp/"
          rm -rf "$tmp/rust/target"
          cd "$tmp/rust"
          sed -i '/^publish = false/d' Cargo.toml
          if grep -q '^publish' Cargo.toml; then exit 1; fi
          cargo package --list --allow-dirty | tee files.txt
          grep -qx 'README.md' files.txt
          grep -qx 'src/lib.rs' files.txt
          if grep -E '^(tests/|fixtures/|\.\./)' files.txt; then echo "package carries tests or fixtures"; exit 1; fi
          cargo publish --dry-run --allow-dirty --locked

  fixtures:
    # The manifest covers exactly the fixture files, and every hash matches.
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 5
    defaults:
      run:
        working-directory: fixtures
    steps:
      - uses: actions/checkout@v4
      - run: sha256sum --strict -c FIXTURES.sha256
      - name: the manifest lists every fixture file and nothing else
        run: diff <(find . -name '*.json' | sed 's|^\./||' | LC_ALL=C sort) <(awk '{print $2}' FIXTURES.sha256 | LC_ALL=C sort)

  python:
    # The Python verifier: lint, types, the shared fixture loop, the differential test against the
    # Rust crate (needs cargo), and the generator check that the negative fixtures are current.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked --python 3.12
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy
      - run: uv run pytest -v
      - name: negative fixtures and manifest are current
        run: uv run python tools/gen_negative_fixtures.py --check
