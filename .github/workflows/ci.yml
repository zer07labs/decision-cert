name: ci

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  wording:
    # A certificate describes a measured process and never promises an outcome. Fail on any promise
    # word in the public docs, except the sentences that say a certificate never guarantees one.
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: no outcome promises in spec, docs or top-level docs
        run: |
          hits="$(grep -rniE 'warrant|guarantee|assur|underwrit' spec docs plans demo README.md CONTRIBUTING.md SECURITY.md CHANGELOG.md wasm/npm/README.md \
            | grep -viE 'never guarantees? (an|one) outcome' || true)"
          if [ -n "$hits" ]; then echo "$hits"; exit 1; fi

  rust:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - run: cargo test --locked --all-features
      # The conformance suite reads ../fixtures; run it by name so a skipped or empty run fails loudly.
      - name: conformance fixtures (fixtures/)
        run: |
          test "$(find ../fixtures -maxdepth 1 -name '*.json' | wc -l)" -ge 14
          test "$(find ../fixtures/v1.1 -maxdepth 1 -name '*.json' | wc -l)" -ge 9
          test "$(find ../fixtures/v1.2 -maxdepth 1 -name '*.json' | wc -l)" -ge 25
          test "$(find ../fixtures/v1.3 -maxdepth 1 -name '*.json' | wc -l)" -ge 43
          test "$(find ../fixtures/v1.4 -maxdepth 1 -name '*.json' | wc -l)" -ge 84
          test "$(find ../fixtures/v1.5 -maxdepth 1 -name '*.json' | wc -l)" -ge 108
          cargo test --locked --test conformance -- --exact rust_and_python_agree_on_every_fixture every_schema_invalid_mutation_is_rejected rust_and_python_agree_on_every_v1_1_fixture every_v1_1_schema_invalid_mutation_is_rejected rust_and_python_agree_on_every_v1_2_fixture every_v1_2_schema_invalid_mutation_is_rejected rust_and_python_agree_on_every_v1_3_fixture every_v1_3_schema_invalid_mutation_is_rejected rust_and_python_agree_on_every_v1_4_fixture every_v1_4_schema_invalid_mutation_is_rejected rust_and_python_agree_on_every_v1_5_fixture every_v1_5_schema_invalid_mutation_is_rejected
      # The inclusion draft's set (fixtures/inclusion-v1/, python/tools/gen_inclusion_fixtures.py): every
      # manifest case's expected outcome; python/tests/test_inclusion.py holds the Python verifier to the
      # same manifest and compares the two CLIs line for line.
      - name: inclusion fixtures (fixtures/inclusion-v1/)
        run: |
          test "$(find ../fixtures/inclusion-v1 -name '*.json' | wc -l)" -ge 231
          test "$(jq '.cases | length' ../fixtures/inclusion-v1/manifest.json)" -ge 300
          cargo test --locked --test inclusion_fixtures -- --exact rust_agrees_with_every_inclusion_v1_case every_inclusion_error_name_has_a_case the_inclusion_v1_hash_list_is_whole
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: rust/Cargo.toml
          command: check
          arguments: --all-features

  wasm:
    # The npm package `decision-cert`: the crate compiled to WebAssembly (wasm/), built with pinned tools,
    # then every fixture set (v1 to v1.5 with their mutations, and inclusion-v1) run through it in Node
    # and compared with the verdicts the Rust tests expect. The Rust crate is the oracle. The versions
    # here are the release workflow's npm job's; change them together.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.100.0"
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: wasm
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.15.1,wasm-bindgen@0.2.130
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"
      - name: the pinned tool versions
        run: |
          rustc --version | grep -F 'rustc 1.100.0 '
          test "$(wasm-pack --version)" = "wasm-pack 0.15.1"
          test "$(wasm-bindgen --version)" = "wasm-bindgen 0.2.130"
          test "$(node --version)" = "v22.23.4"
          grep -A1 '^name = "wasm-bindgen"$' wasm/Cargo.lock | grep -qx 'version = "0.2.130"'
      - name: fmt and clippy (wasm32)
        working-directory: wasm
        run: |
          cargo fmt --check
          cargo clippy --target wasm32-unknown-unknown --all-targets --locked -- -D warnings
      - name: the npm package's name, version and LICENSE
        run: |
          v="$(grep -m1 '^version = ' rust/Cargo.toml | cut -d'"' -f2)"
          test "$(jq -r .name wasm/npm/package.json)" = decision-cert
          test "$(jq -r .version wasm/npm/package.json)" = "$v"
          grep -qx "version = \"$v\"" wasm/Cargo.toml
          test "$(jq -r .license wasm/npm/package.json)" = Apache-2.0
          cmp LICENSE wasm/npm/LICENSE
      - name: build the npm package (wasm-pack --target nodejs)
        run: wasm/build.sh
      - name: every fixture set through the WebAssembly build, against the Rust tests' verdicts
        run: |
          set -o pipefail
          node wasm/conformance.cjs wasm/dist fixtures | tee "$RUNNER_TEMP/conformance.txt"
          { echo '```'; cat "$RUNNER_TEMP/conformance.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: npm pack --dry-run lists exactly the package's files
        working-directory: wasm/dist
        run: |
          npm pack --dry-run --json > "$RUNNER_TEMP/pack.json"
          jq -r '.[0].files[].path' "$RUNNER_TEMP/pack.json" | LC_ALL=C sort | tee "$RUNNER_TEMP/files.txt"
          diff "$RUNNER_TEMP/files.txt" <(printf '%s\n' LICENSE README.md decision_cert.d.ts decision_cert.js decision_cert_bg.wasm decision_cert_bg.wasm.d.ts package.json | LC_ALL=C sort)
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: wasm/Cargo.toml
          command: check

  publish-readiness:
    # Release readiness without publishing: the crate packages and dry-runs, the docs build as
    # docs.rs builds them, the Python sdist and wheel build and pass metadata checks, and both
    # packages carry the repository LICENSE.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: docs build as docs.rs does (warnings are errors)
        working-directory: rust
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --all-features --locked
      - name: the packaged LICENSE files and the issuer's schema match the repository's
        run: |
          cmp LICENSE rust/LICENSE && cmp LICENSE python/LICENSE
          cmp spec/decision-certificate.v1.schema.json python/src/decision_cert/issue/decision-certificate.v1.schema.json
          cmp spec/decision-certificate.v1.1.schema.json python/src/decision_cert/issue/decision-certificate.v1.1.schema.json
          cmp spec/decision-certificate.v1.2.schema.json python/src/decision_cert/issue/decision-certificate.v1.2.schema.json
          cmp spec/decision-certificate.v1.3.schema.json python/src/decision_cert/issue/decision-certificate.v1.3.schema.json
          cmp spec/decision-certificate.v1.4.schema.json python/src/decision_cert/issue/decision-certificate.v1.4.schema.json
          cmp spec/decision-certificate.v1.5.schema.json python/src/decision_cert/issue/decision-certificate.v1.5.schema.json
      - name: cargo package --list and cargo publish --dry-run
        working-directory: rust
        run: |
          if grep -q '^publish' Cargo.toml; then echo "Cargo.toml must not set publish"; exit 1; fi
          cargo package --list --locked | tee "$RUNNER_TEMP/files.txt"
          for f in README.md LICENSE src/lib.rs src/bin/decision-cert.rs; do grep -qx "$f" "$RUNNER_TEMP/files.txt"; done
          if grep -E '^(tests/|fixtures/|examples/)' "$RUNNER_TEMP/files.txt"; then echo "package carries tests or fixtures"; exit 1; fi
          cargo publish --dry-run --locked
      - uses: astral-sh/setup-uv@v6
      - name: Python sdist and wheel build and pass metadata checks
        working-directory: python
        run: |
          uv build --out-dir "$RUNNER_TEMP/dist"
          uvx twine check --strict "$RUNNER_TEMP"/dist/*
          unzip -l "$RUNNER_TEMP"/dist/*.whl | grep -q 'decision_cert/py.typed'
          unzip -l "$RUNNER_TEMP"/dist/*.whl | grep -q 'licenses/LICENSE'
          unzip -l "$RUNNER_TEMP"/dist/*.whl | grep -q 'decision_cert/issue/decision-certificate.v1.schema.json'
          unzip -l "$RUNNER_TEMP"/dist/*.whl | grep -q 'decision_cert/issue/decision-certificate.v1.1.schema.json'
          unzip -l "$RUNNER_TEMP"/dist/*.whl | grep -q 'decision_cert/issue/decision-certificate.v1.2.schema.json'
          unzip -l "$RUNNER_TEMP"/dist/*.whl | grep -q 'decision_cert/issue/decision-certificate.v1.3.schema.json'
          unzip -l "$RUNNER_TEMP"/dist/*.whl | grep -q 'decision_cert/issue/decision-certificate.v1.4.schema.json'
          unzip -l "$RUNNER_TEMP"/dist/*.whl | grep -q 'decision_cert/issue/decision-certificate.v1.5.schema.json'
      - name: the base install verifies without the issuer's dependencies
        run: |
          uv venv -q "$RUNNER_TEMP/base" --python 3.12
          uv pip install -q --python "$RUNNER_TEMP/base" "$RUNNER_TEMP"/dist/*.whl
          "$RUNNER_TEMP/base/bin/python" -c "import importlib.util as u, decision_cert; assert u.find_spec('numpy') is None"
          "$RUNNER_TEMP/base/bin/python" -m decision_cert verify demo/example/certificate.json --keys demo/example/trusted-keys.json --now 2026-11-07T00:00:00Z

  fixtures:
    # The manifest covers exactly the fixture files, and every hash matches.
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 5
    defaults:
      run:
        working-directory: fixtures
    steps:
      - uses: actions/checkout@v4
      - run: sha256sum --strict -c FIXTURES.sha256
      - name: the manifest lists every v1 fixture file and nothing else
        run: diff <(find . \( -path ./v1.1 -o -path ./v1.2 -o -path ./v1.3 -o -path ./v1.4 -o -path ./v1.5 -o -path ./inclusion-v1 \) -prune -o -name '*.json' -print | sed 's|^\./||' | LC_ALL=C sort) <(awk '{print $2}' FIXTURES.sha256 | LC_ALL=C sort)
      - name: the v1.1 set's manifest, the same way
        working-directory: fixtures/v1.1
        run: |
          sha256sum --strict -c FIXTURES.sha256
          diff <(find . -name '*.json' | sed 's|^\./||' | LC_ALL=C sort) <(awk '{print $2}' FIXTURES.sha256 | LC_ALL=C sort)
      - name: the v1.2 set's manifest, the same way
        working-directory: fixtures/v1.2
        run: |
          sha256sum --strict -c FIXTURES.sha256
          diff <(find . -name '*.json' | sed 's|^\./||' | LC_ALL=C sort) <(awk '{print $2}' FIXTURES.sha256 | LC_ALL=C sort)
      - name: the v1.3 set's manifest, the same way
        working-directory: fixtures/v1.3
        run: |
          sha256sum --strict -c FIXTURES.sha256
          diff <(find . -name '*.json' | sed 's|^\./||' | LC_ALL=C sort) <(awk '{print $2}' FIXTURES.sha256 | LC_ALL=C sort)
      - name: the v1.4 set's manifest, the same way
        working-directory: fixtures/v1.4
        run: |
          sha256sum --strict -c FIXTURES.sha256
          diff <(find . -name '*.json' | sed 's|^\./||' | LC_ALL=C sort) <(awk '{print $2}' FIXTURES.sha256 | LC_ALL=C sort)
      - name: the v1.5 set's manifest, the same way
        working-directory: fixtures/v1.5
        run: |
          sha256sum --strict -c FIXTURES.sha256
          diff <(find . -name '*.json' | sed 's|^\./||' | LC_ALL=C sort) <(awk '{print $2}' FIXTURES.sha256 | LC_ALL=C sort)
      - name: the inclusion-v1 set's hash list, the same way
        working-directory: fixtures/inclusion-v1
        run: |
          sha256sum --strict -c INCLUSION.sha256
          diff <(find . -type f ! -name INCLUSION.sha256 | sed 's|^\./||' | LC_ALL=C sort) <(awk '{print $2}' INCLUSION.sha256 | LC_ALL=C sort)

  c2sp-interop:
    # An independent check of fixtures/inclusion-v1/ with the Go C2SP libraries (interop/c2sp/, pinned in
    # its go.mod and go.sum): the log signature and witness cosignatures of every checkpoint the manifest
    # accepts, and the library's refusal, with the same error name, of every signature case it refuses.
    # Informational: a disagreement is reported, never fixed by changing the spec or the fixtures.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    continue-on-error: true
    defaults:
      run:
        working-directory: interop/c2sp
    env:
      GOTOOLCHAIN: local
      GOFLAGS: -mod=readonly
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5.5.0
        with:
          go-version: "1.27.2"
          cache-dependency-path: interop/c2sp/go.sum
      - name: the C2SP libraries verify the inclusion-v1 checkpoints
        run: go run . ../../fixtures/inclusion-v1
      - name: the toolchain and the library versions it ran with
        if: always()
        run: |
          go version
          go list -m -f '{{.Path}} {{.Version}}' github.com/transparency-dev/formats golang.org/x/mod golang.org/x/crypto

  python:
    # The Python verifier: lint, types, the shared fixture loop, the differential test against the
    # Rust crate (needs cargo), the reference log and witness end to end through both CLIs, and the
    # generator check that the negative fixtures are current.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked --python 3.12
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy
      - run: uv run pytest -v
      - name: the reference log and witness end to end through both CLIs, built here (fails on any skip)
        # init -> append -> checkpoint -> witness cosign -> prove -> bundle -> verify-bundle (Python and
        # Rust) -> append -> checkpoint -> consistency -> verify-consistency (both) -> a forked log refused.
        # DECISION_CERT_REQUIRE_RUST turns a missing cargo into a failure; the greps check the test ran.
        env:
          DECISION_CERT_REQUIRE_RUST: "1"
        run: |
          set -o pipefail
          uv run pytest tests/test_log.py -v -rs | tee "$RUNNER_TEMP/e2e.log"
          grep -F 'tests/test_log.py::test_end_to_end_issue_log_cosign_prove_bundle_verify PASSED' "$RUNNER_TEMP/e2e.log"
          if grep -E 'SKIPPED|skipped' "$RUNNER_TEMP/e2e.log"; then echo "a reference log test was skipped"; exit 1; fi
      - name: the reference issuer regenerates its fixtures byte-identical
        run: uv run python tools/gen_positive_fixtures.py --check
      - name: negative fixtures and manifest are current
        run: uv run python tools/gen_negative_fixtures.py --check
      - name: demo files and manifest are current
        run: uv run python tools/gen_demos.py --check
      - name: inclusion-v1 fixtures and hash list are current (fixtures/inclusion-v1/)
        run: uv run python tools/gen_inclusion_fixtures.py --check
      - name: evidence-pack fixtures and manifest are current
        run: |
          uv run python tools/gen_pack_fixtures.py --check
          (cd tests/packs && sha256sum --strict -c PACKS.sha256)

  demos:
    # Every demo file is hash-listed, and both verifiers accept every demo certificate.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: the manifest lists every demo file, and every hash matches
        working-directory: demo
        run: |
          sha256sum --strict -c DEMOS.sha256
          diff <(find . -name '*.json' | sed 's|^\./||' | LC_ALL=C sort) <(awk '{print $2}' DEMOS.sha256 | LC_ALL=C sort)
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - uses: astral-sh/setup-uv@v6
      - name: the Rust and Python CLIs verify every demo certificate
        run: |
          (cd rust && cargo build -q --locked --features cli)
          (cd python && uv sync -q --locked --python 3.12)
          n=0
          while IFS= read -r c; do
            d="$(dirname "$c")"; k="$d/trusted-keys.json"
            now="$(jq -r .fitted_at "$c")"  # inside the validity window, so the check never expires
            r="$(rust/target/debug/decision-cert verify "$c" --keys "$k" --now "$now")"
            p="$(cd python && uv run -q python -m decision_cert verify "../$c" --keys "../$k" --now "$now")"
            test "$r" = "$p"; echo "$c $r"; n=$((n + 1))
            if [ -f "$d/model.json" ]; then
              test "$(jq -r .manifest_hash "$c")" = "sha256:$(sha256sum "$d/model.json" | cut -d' ' -f1)"
            fi
          done < <(find demo -name certificate.json | LC_ALL=C sort)
          test "$n" -ge 1

  quickstart:
    # Runs the README's quickstart line with the published package. On a pull request the URLs point
    # at the PR's head commit instead of main, since the files may not be on main yet.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: the documented line exits 0
        env:
          REF: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          line="$(sed -n '/<!-- quickstart -->/,/^```$/p' README.md | sed -n '3p')"
          case "$line" in "uvx decision-cert verify "*) ;; *) echo "quickstart line not found: $line"; exit 1 ;; esac
          bash -c "${line//\/main\//\/$REF\/}"
