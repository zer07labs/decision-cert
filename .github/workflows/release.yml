name: release

# Publishes decision-cert to crates.io, PyPI and npm when the owner pushes a tag vX.Y.Z on main.
# crates.io: the CRATES_IO_TOKEN repository secret. PyPI: trusted publishing (OIDC), no token;
# the PyPI project trusts this repository, workflow `release.yml` and environment `pypi`.
# npm: the NPM_TOKEN secret of environment `npm`, published with provenance (OIDC, `id-token: write`);
# the package is the WebAssembly build in wasm/, built with the tool versions the CI `wasm` job pins.
#
# The three registries are separate jobs: a failure in one never blocks the others. To publish one
# registry alone (e.g. PyPI once trusted publishing is set up, after crates.io went out), run this
# workflow by hand on the tag (Actions -> release -> Run workflow, "Use workflow from": the tag)
# and pick the target, or re-run just that failed job.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      target:
        description: Registry to publish to (run on a vX.Y.Z tag)
        type: choice
        options: [all, crates-io, pypi, npm]
        default: all

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: the tag is on main and matches every package version
        run: |
          if [ "$GITHUB_REF_TYPE" != tag ]; then echo "run on a vX.Y.Z tag, not $GITHUB_REF"; exit 1; fi
          v="${GITHUB_REF_NAME#v}"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          grep -qx "version = \"$v\"" rust/Cargo.toml
          grep -qx "version = \"$v\"" python/pyproject.toml
          grep -qx "__version__ = \"$v\"" python/src/decision_cert/__init__.py
          grep -qx "version = \"$v\"" wasm/Cargo.toml
          test "$(jq -r .version wasm/npm/package.json)" = "$v"
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v6
      - name: the full test suite passes at the tag
        run: |
          (cd rust && cargo test --locked --all-features)
          (cd python && uv sync --locked --python 3.12 && uv run pytest -q)

  crates-io:
    needs: check
    if: github.event_name == 'push' || inputs.target == 'all' || inputs.target == 'crates-io'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    environment: crates-io
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo publish
        working-directory: rust
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: cargo publish --locked

  pypi:
    needs: check
    if: github.event_name == 'push' || inputs.target == 'all' || inputs.target == 'pypi'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    environment: pypi
    permissions:
      contents: read
      id-token: write  # trusted publishing
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: build sdist and wheel
        working-directory: python
        run: uv build --out-dir dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist

  npm:
    # The WebAssembly build, with the tool versions the CI `wasm` job pins (change them together); every
    # fixture set runs through it before it is published. The .wasm's SHA-256 is in the job summary and
    # log, and the readback checks the published file against it.
    needs: check
    if: github.event_name == 'push' || inputs.target == 'all' || inputs.target == 'npm'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    environment: npm
    permissions:
      contents: read
      id-token: write  # npm provenance
    outputs:
      wasm_sha256: ${{ steps.build.outputs.wasm_sha256 }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.100.0"
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.15.1,wasm-bindgen@0.2.130
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"
          registry-url: https://registry.npmjs.org
      - name: the pinned tool versions
        run: |
          rustc --version | grep -F 'rustc 1.100.0 '
          test "$(wasm-pack --version)" = "wasm-pack 0.15.1"
          test "$(wasm-bindgen --version)" = "wasm-bindgen 0.2.130"
          test "$(node --version)" = "v22.23.4"
      - name: build the package, and its .wasm's SHA-256
        id: build
        run: |
          wasm/build.sh
          d="$(sha256sum wasm/dist/decision_cert_bg.wasm | cut -d' ' -f1)"
          echo "wasm_sha256=$d" >> "$GITHUB_OUTPUT"
          echo "decision-cert ${GITHUB_REF_NAME#v} (npm): decision_cert_bg.wasm sha256 $d"
          { echo "### decision-cert ${GITHUB_REF_NAME#v} on npm"; echo; echo "\`decision_cert_bg.wasm\` sha256: \`$d\`"; } >> "$GITHUB_STEP_SUMMARY"
      - name: every fixture set through the package before it is published
        run: node wasm/conformance.cjs wasm/dist fixtures
      - name: npm publish
        working-directory: wasm/dist
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --provenance

  readback:
    # After the publishes: install the tagged version fresh from PyPI, crates.io and npm, with no
    # repository source on the path, and check fixtures against their recorded verdicts.
    needs: [crates-io, pypi, npm]
    if: github.event_name == 'push'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"
      - name: PyPI serves the version, and a fresh install verifies the v1.4 fixtures
        run: |
          v="${GITHUB_REF_NAME#v}"; fx="$GITHUB_WORKSPACE/fixtures/v1.4"; rb="$RUNNER_TEMP/rb-py"
          # Poll what uv installs from (the simple index), not the JSON API: the index can lag it.
          uv venv -q "$rb"
          for i in $(seq 1 40); do
            uv pip install -q --python "$rb" --no-cache --refresh "decision-cert==$v" && break
            [ "$i" = 40 ] && { echo "PyPI's index does not serve $v"; exit 1; }; sleep 15
          done
          cd "$RUNNER_TEMP" && "$rb/bin/python" -I - "$v" "$fx" <<'PY'
          import json, sys
          from pathlib import Path
          import decision_cert as dc
          v, fx = sys.argv[1], Path(sys.argv[2])
          assert dc.__version__ == v, (dc.__version__, v)
          assert "site-packages" in dc.__file__, dc.__file__
          n = 0
          for p in sorted(fx.glob("*.json")):
              f = json.loads(p.read_text())
              try:
                  got = dc.verify(f["certificate"], f["keys"]).id
              except Exception:
                  got = None
              if f["valid"]:
                  assert got == f["certificate_id"], p.name
              else:
                  assert got is None, p.name
              n += 1
          assert n >= 84, n
          print(f"decision-cert {v} from PyPI: {n} v1.4 fixtures agree with their verdicts")
          PY
      - name: crates.io serves the version, and a fresh build verifies the v1.4 fixtures
        run: |
          v="${GITHUB_REF_NAME#v}"; rb="$RUNNER_TEMP/rb-rs"
          cargo new -q --bin "$rb"
          cat >> "$rb/Cargo.toml" <<TOML
          decision-cert = "=$v"
          serde_json = "1"
          TOML
          cat > "$rb/src/main.rs" <<'RS'
          use std::collections::BTreeMap;
          fn main() {
              let mut n = 0;
              for path in std::env::args().skip(1) {
                  let f: serde_json::Value = serde_json::from_str(&std::fs::read_to_string(&path).unwrap()).unwrap();
                  let keys: BTreeMap<String, String> = serde_json::from_value(f["keys"].clone()).unwrap();
                  let got = decision_cert::verify(&f["certificate"], &keys).ok().map(|x| x.id);
                  let want = f["valid"].as_bool().unwrap().then(|| f["certificate_id"].as_str().unwrap().to_string());
                  assert_eq!(got, want, "{path}");
                  n += 1;
              }
              assert!(n >= 84, "{n}");
              println!("decision-cert from crates.io: {n} v1.4 fixtures agree with their verdicts");
          }
          RS
          for i in $(seq 1 40); do
            (cd "$rb" && cargo update -q 2>/dev/null) && break
            [ "$i" = 40 ] && { echo "crates.io does not serve $v"; exit 1; }; sleep 15
          done
          grep -A1 'name = "decision-cert"' "$rb/Cargo.lock"
          (cd "$rb" && cargo run -q --release -- "$GITHUB_WORKSPACE"/fixtures/v1.4/*.json)
      - name: npm serves the version, its .wasm is the one published, and a fresh install verifies the v1.5 fixtures
        env:
          WASM_SHA256: ${{ needs.npm.outputs.wasm_sha256 }}
        run: |
          v="${GITHUB_REF_NAME#v}"; rb="$RUNNER_TEMP/rb-npm"
          mkdir -p "$rb" && cd "$rb" && npm init -y >/dev/null
          for i in $(seq 1 40); do
            npm install -q --ignore-scripts --no-audit --no-fund --prefer-online "decision-cert@$v" && break
            [ "$i" = 40 ] && { echo "npm does not serve $v"; exit 1; }; sleep 15
          done
          test "$(jq -r .version node_modules/decision-cert/package.json)" = "$v"
          echo "npm dist.integrity: $(npm view "decision-cert@$v" dist.integrity)"
          d="$(sha256sum node_modules/decision-cert/decision_cert_bg.wasm | cut -d' ' -f1)"
          echo "decision-cert $v from npm: decision_cert_bg.wasm sha256 $d (built and published: $WASM_SHA256)"
          test "$d" = "$WASM_SHA256"
          { echo "### decision-cert $v from npm"; echo; echo "\`decision_cert_bg.wasm\` sha256: \`$d\`"; } >> "$GITHUB_STEP_SUMMARY"
          node "$GITHUB_WORKSPACE/wasm/conformance.cjs" "$rb/node_modules/decision-cert" "$GITHUB_WORKSPACE/fixtures" v1.5
