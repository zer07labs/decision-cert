name: release

# Publishes decision-cert to crates.io and PyPI when the owner pushes a tag vX.Y.Z on main.
# crates.io: the CRATES_IO_TOKEN repository secret. PyPI: trusted publishing (OIDC), no token;
# the PyPI project trusts this repository, workflow `release.yml` and environment `pypi`.
#
# The two registries are separate jobs: a failure in one never blocks the other. To publish one
# registry alone (e.g. PyPI once trusted publishing is set up, after crates.io went out), run this
# workflow by hand on the tag (Actions -> release -> Run workflow, "Use workflow from": the tag)
# and pick the target, or re-run just that failed job.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      target:
        description: Registry to publish to (run on a vX.Y.Z tag)
        type: choice
        options: [both, crates-io, pypi]
        default: both

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: the tag is on main and matches both package versions
        run: |
          if [ "$GITHUB_REF_TYPE" != tag ]; then echo "run on a vX.Y.Z tag, not $GITHUB_REF"; exit 1; fi
          v="${GITHUB_REF_NAME#v}"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          grep -qx "version = \"$v\"" rust/Cargo.toml
          grep -qx "version = \"$v\"" python/pyproject.toml
          grep -qx "__version__ = \"$v\"" python/src/decision_cert/__init__.py
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v6
      - name: the full test suite passes at the tag
        run: |
          (cd rust && cargo test --locked --all-features)
          (cd python && uv sync --locked --python 3.12 && uv run pytest -q)

  crates-io:
    needs: check
    if: github.event_name == 'push' || inputs.target != 'pypi'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    environment: crates-io
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo publish
        working-directory: rust
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: cargo publish --locked

  pypi:
    needs: check
    if: github.event_name == 'push' || inputs.target != 'crates-io'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    environment: pypi
    permissions:
      contents: read
      id-token: write  # trusted publishing
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: build sdist and wheel
        working-directory: python
        run: uv build --out-dir dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist
